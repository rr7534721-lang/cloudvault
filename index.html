<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secure Content Access</title>
<style>
  :root {
    --bg: #0b0f19;
    --surface: #131a2a;
    --surface-2: #1c253b;
    --line: rgba(255, 255, 255, 0.12);
    --text: #f8fafc;
    --muted: #94a3b8;
    --brand: #3b82f6;
    --brand-hi: #2563eb;
    --emerald: #10b981;
    --radius: 22px;
    --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 15px; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column;
  }
  .header {
    padding: 16px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(19, 26, 42, 0.9); backdrop-filter: blur(12px);
  }
  .brand { font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .secure-tag {
    font-size: 0.72rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: rgba(16, 185, 129, 0.14); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.35);
  }
  .container { max-width: 720px; width: 100%; margin: 0 auto; padding: 24px 16px 48px; flex: 1; }

  .player-stage {
    position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
    background: linear-gradient(145deg, #1e293b, #090d16); border: 1px solid var(--line);
    box-shadow: 0 20px 50px rgba(0,0,0,0.55);
  }
  .player-stage img, .player-stage iframe, .player-stage video {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover;
  }
  .player-stage iframe, .player-stage video { background: #000; object-fit: contain; }
  .player-stage.locked img { filter: brightness(0.78); transform: none; }

  .lock-overlay {
    position: absolute; inset: 0; display: grid; place-content: center; justify-items: center;
    gap: 10px; padding: 20px; text-align: center;
    background: radial-gradient(circle at center, rgba(11, 15, 25, 0.42) 0%, rgba(11, 15, 25, 0.18) 100%);
  }
  .lock-icon {
    width: 56px; height: 56px; border-radius: 50%; background: rgba(15, 23, 42, 0.72);
    backdrop-filter: blur(4px); border: 1.5px solid rgba(96, 165, 250, 0.7);
    display: grid; place-items: center; color: #60a5fa;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .lock-overlay h2 { margin: 0; font-size: 1.2rem; font-weight: 800; color: #ffffff; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9); }
  .lock-overlay p { margin: 0; font-size: 0.88rem; font-weight: 600; color: #f8fafc; max-width: 340px; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95); }

  .details-card {
    margin-top: 20px; background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px;
  }
  .cat-pill { display: inline-block; font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: #60a5fa; margin-bottom: 6px; }
  .details-card h1 { margin: 0; font-size: 1.45rem; font-weight: 800; line-height: 1.25; }
  .desc { margin: 8px 0 0; color: var(--muted); font-size: 0.92rem; }

  .price-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .price-val { font-size: 1.75rem; font-weight: 800; color: #fff; }
  .price-sub { font-size: 0.78rem; color: var(--muted); }

  .pay-section { margin-top: 18px; display: grid; gap: 12px; }
  .btn-pay {
    width: 100%; min-height: 54px; border-radius: 16px; border: 0; cursor: pointer;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff;
    font-family: inherit; font-size: 1.02rem; font-weight: 800;
    box-shadow: 0 12px 30px rgba(37, 99, 235, 0.35);
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  .btn-pay:disabled { opacity: 0.6; cursor: progress; }

  .pay-methods-note { text-align: center; font-size: 0.78rem; color: var(--muted); }
  .unlocked-banner { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 16px; padding: 16px; display: grid; gap: 8px; }
  .msg { font-size: 0.84rem; font-weight: 600; color: #f87171; text-align: center; margin: 0; }
  .msg.ok { color: var(--emerald); }

  .wa-float {
    position: fixed; right: 20px; bottom: 24px; z-index: 90;
    width: 60px; height: 60px; border-radius: 50%;
    background: #25D366; color: #ffffff;
    display: grid; place-items: center;
    box-shadow: 0 10px 28px rgba(37, 211, 102, 0.45);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    text-decoration: none;
  }
  .wa-float:hover { transform: scale(1.07); box-shadow: 0 14px 34px rgba(37, 211, 102, 0.6); }
  .wa-float svg { width: 32px; height: 32px; fill: currentColor; }
</style>
</head>
<body>

<header class="header">
  <span class="brand" id="v-brand">CloudVault</span>
  <span class="secure-tag">Verified Link</span>
</header>

<main class="container" id="viewer-root"></main>

<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const inr = (n) => "₹" + Math.round(Number(n) || 0).toLocaleString("en-IN");
  const UNLOCK_KEY = "cv_viewer_unlocked_v6";
  const SALES_KEY = "cv_realtime_sales_v2";
  const DEFAULT_WA = "9421351153";

  function b64uDec(str) {
    try {
      const s = String(str).replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(s + "=".repeat((4 - (s.length % 4)) % 4));
      return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    } catch (e) { return null; }
  }

  function isPaid(id) {
    try { const m = JSON.parse(localStorage.getItem(UNLOCK_KEY)) || {}; return !!m[id]; } catch (e) { return false; }
  }

  function recordRazorpayPurchase(data, txId, buyerInfo) {
    try {
      const m = JSON.parse(localStorage.getItem(UNLOCK_KEY)) || {};
      m[data.id] = { txId, at: Date.now() };
      localStorage.setItem(UNLOCK_KEY, JSON.stringify(m));

      const sales = JSON.parse(localStorage.getItem(SALES_KEY)) || [];
      const entry = {
        txId: txId || ("rzp_" + Date.now().toString(36)),
        fileId: data.id,
        title: data.t,
        amount: Number(data.p) || 0,
        buyer: buyerInfo || "",
        method: "Razorpay",
        at: Date.now()
      };
      sales.unshift(entry);
      localStorage.setItem(SALES_KEY, JSON.stringify(sales));

      if (data.wh && /^https:\/\//i.test(data.wh)) {
        fetch(data.wh, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(entry)
        }).catch(() => {});
      }
    } catch (e) {}
  }

  function parseMedia(url) {
    let u;
    try { u = new URL(url); } catch (e) { return { kind: "link", url: String(url) }; }
    const host = u.hostname.replace(/^(www|m)\./, "");
    let id = "";
    if (host === "youtu.be") id = u.pathname.slice(1).split("/")[0];
    else if (host.endsWith("youtube.com")) {
      if (u.pathname === "/watch") id = u.searchParams.get("v") || "";
      else { const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{6,})/); if (m) id = m[1]; }
    }
    if (/^[\w-]{6,20}$/.test(id)) {
      return { kind: "embed", thumb: `https://i.ytimg.com/vi/${id}/hqdefault.jpg`, src: `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0` };
    }
    if (host === "drive.google.com") {
      const m = u.pathname.match(/\/file\/d\/([\w-]+)/);
      const fid = m ? m[1] : (u.searchParams.get("id") || "");
      if (/^[\w-]{10,}$/.test(fid)) return { kind: "embed", src: `https://drive.google.com/file/d/${fid}/preview` };
    }
    if (/\.(mp4|webm|mov|m4v|mkv)$/i.test(u.pathname)) {
      return { kind: "video", src: u.toString() };
    }
    return { kind: "link", url: u.toString() };
  }

  async function getLocalBlob(id) {
    return new Promise((res) => {
      const r = indexedDB.open("cv-unlimited-vault", 1);
      r.onsuccess = () => {
        try {
          const tx = r.result.transaction("blobs", "readonly");
          const req = tx.objectStore("blobs").get(id);
          req.onsuccess = () => res(req.result ? URL.createObjectURL(req.result) : null);
          req.onerror = () => res(null);
        } catch (e) { res(null); }
      };
      r.onerror = () => res(null);
    });
  }

  let currentData = null;

  async function renderLanding() {
    const q = new URLSearchParams(location.search);
    const raw = q.get("play");
    let data = raw ? b64uDec(raw) : null;

    if (!data || !data.id) {
      data = {
        id: "demo_preview_final",
        t: "Full HD Action Movie & Exclusive Pack (1080p)",
        c: "Full Movie / Exclusive Video",
        d: "Instant streaming & direct download after Razorpay payment.",
        u: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        th: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1000&q=85",
        p: 29,
        k: "rzp_test_TzKlCGvzMHyC8Y",
        wa: "9421351153",
        b: "CloudVault"
      };
    }

    currentData = data;
    $("#v-brand").textContent = data.b || "CloudVault";
    document.title = `${data.t} · ${data.b || "Access"}`;

    const price = Number(data.p) || 0;
    const unlocked = price <= 0 || isPaid(data.id);
    const media = data.u ? parseMedia(data.u) : { kind: "local" };
    const thumbSrc = data.th || media.thumb || "https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1000&q=85";

    let localUrl = null;
    if (unlocked && !data.u) localUrl = await getLocalBlob(data.id);

    let stageHtml = "";
    if (!unlocked) {
      stageHtml = `
        <div class="player-stage locked">
          <img src="${esc(thumbSrc)}" alt="Thumbnail">
          <div class="lock-overlay">
            <div class="lock-icon">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
            </div>
            <h2>Content Locked</h2>
            <p>Complete payment of <b>${inr(price)}</b> via Razorpay below to unlock and watch immediately.</p>
          </div>
        </div>
      `;
    } else if (media.kind === "embed") {
      stageHtml = `<div class="player-stage"><iframe src="${esc(media.src)}" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
    } else if (media.kind === "video") {
      stageHtml = `<div class="player-stage"><video src="${esc(media.src)}" controls autoplay playsinline></video></div>`;
    } else if (localUrl) {
      stageHtml = `<div class="player-stage"><video src="${esc(localUrl)}" controls autoplay playsinline></video></div>`;
    } else if (data.u) {
      stageHtml = `
        <div class="player-stage">
          <img src="${esc(thumbSrc)}" alt="" style="filter:brightness(0.45)">
          <div class="lock-overlay">
            <h2>Your File is Ready!</h2>
            <a class="btn-pay" style="max-width:260px;margin-top:8px" href="${esc(data.u)}" target="_blank" rel="noopener">Open / Download File</a>
          </div>
        </div>
      `;
    } else {
      stageHtml = `<div class="player-stage"><div class="lock-overlay"><h2>File Stored on Creator Device</h2><p>Ask the creator to share a Cloud Link for remote access.</p></div></div>`;
    }

    let actionHtml = "";
    if (unlocked) {
      actionHtml = `
        <div class="unlocked-banner">
          <strong style="color:var(--emerald)">✓ Razorpay Payment Verified · Video Unlocked</strong>
          <span style="font-size:0.85rem;color:var(--muted)">Aap upar video play ya file download kar sakte hain.</span>
        </div>
      `;
    } else {
      const hasRzp = /^rzp_(test|live)_/.test(data.k || "");
      actionHtml = `
        <div class="pay-section">
          ${hasRzp
            ? `<button type="button" class="btn-pay" id="btn-rzp">Pay ${inr(price)} & Unlock Now</button>
               <div class="pay-methods-note">Instant Auto-Unlock via Razorpay (UPI, GPay, PhonePe, Paytm, Cards)</div>`
            : `<p class="msg">Razorpay Key ID set nahi hai.</p>`
          }
          <p class="msg" id="pay-msg"></p>
        </div>
      `;
    }

    const waDigits = String(data.wa || DEFAULT_WA).replace(/\D/g, "");
    const waPhone = waDigits.length === 10 ? "91" + waDigits : waDigits;
    const waText = encodeURIComponent(`Hi, I need help regarding "${data.t}" on ${data.b || "CloudVault"}.`);
    const waHref = `https://wa.me/${waPhone}?text=${waText}`;

    $("#viewer-root").innerHTML = `
      ${stageHtml}
      <div class="details-card">
        <span class="cat-pill">${esc(data.c || "Exclusive Content")}</span>
        <h1>${esc(data.t)}</h1>
        ${data.d ? `<p class="desc">${esc(data.d)}</p>` : ""}
        <div class="price-bar">
          <div>
            <div class="price-val">${price > 0 ? inr(price) : "FREE"}</div>
            <div class="price-sub">${price > 0 ? "One-time payment · Instant video unlock" : "No payment required"}</div>
          </div>
        </div>
        ${actionHtml}
      </div>
      <a class="wa-float" href="${esc(waHref)}" target="_blank" rel="noopener" aria-label="WhatsApp Support" title="Chat on WhatsApp">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3.2c-7.07 0-12.8 5.73-12.8 12.8 0 2.26.59 4.46 1.71 6.4L3.13 29l6.78-1.78a12.74 12.74 0 0 0 6.13 1.56h.01c7.06 0 12.8-5.73 12.8-12.8 0-3.42-1.33-6.64-3.75-9.05A12.71 12.71 0 0 0 16.04 3.2zm0 23.42h-.01a10.6 10.6 0 0 1-5.4-1.48l-.39-.23-4.02 1.05 1.07-3.92-.25-.4a10.58 10.58 0 0 1-1.63-5.64c0-5.86 4.77-10.63 10.63-10.63 2.84 0 5.51 1.11 7.51 3.11a10.56 10.56 0 0 1 3.12 7.52c0 5.86-4.77 10.62-10.63 10.62zm5.83-7.96c-.32-.16-1.89-.93-2.18-1.04-.29-.11-.51-.16-.72.16-.21.32-.83 1.04-1.01 1.25-.19.21-.37.24-.69.08-.32-.16-1.35-.5-2.57-1.59-.95-.85-1.59-1.89-1.78-2.21-.19-.32-.02-.49.14-.65.14-.14.32-.37.48-.56.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56-.08-.16-.72-1.73-.99-2.37-.26-.62-.52-.54-.72-.55h-.61c-.21 0-.56.08-.85.4-.29.32-1.12 1.09-1.12 2.66s1.15 3.09 1.31 3.3c.16.21 2.26 3.45 5.47 4.84.76.33 1.36.53 1.82.67.77.24 1.47.21 2.02.13.62-.09 1.89-.77 2.16-1.52.27-.75.27-1.39.19-1.52-.08-.13-.29-.21-.61-.37z"/></svg>
      </a>
    `;
  }

  document.addEventListener("click", (e) => {
    if (e.target.id === "btn-rzp" && currentData) {
      const btn = e.target;
      const msg = $("#pay-msg");
      btn.disabled = true;
      msg.className = "msg ok";
      msg.textContent = "Opening secure Razorpay payment...";

      const s = document.createElement("script");
      s.src = "https://checkout.razorpay.com/v1/checkout.js";
      s.onload = () => {
        const rzp = new window.Razorpay({
          key: currentData.k,
          amount: Number(currentData.p) * 100,
          currency: "INR",
          name: currentData.b || "CloudVault",
          description: currentData.t,
          notes: { content_id: currentData.id, content_title: currentData.t },
          theme: { color: "#2563eb" },
          handler: (res) => {
            const payId = (res && res.razorpay_payment_id) || ("rzp_" + Date.now().toString(36));
            recordRazorpayPurchase(currentData, payId, "");
            renderLanding();
          },
          modal: { ondismiss: () => { btn.disabled = false; msg.textContent = ""; } }
        });
        rzp.on("payment.failed", (r) => {
          btn.disabled = false;
          msg.className = "msg";
          msg.textContent = (r && r.error && r.error.description) || "Payment failed. Please try again.";
        });
        rzp.open();
      };
      s.onerror = () => { btn.disabled = false; msg.className = "msg"; msg.textContent = "Payment gateway load nahi hua. Internet check karein."; };
      document.head.appendChild(s);
    }
  });

  renderLanding();
</script>
</body>
</html>
